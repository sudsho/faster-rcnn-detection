# default training config
seed: 42
device: cuda

dataset:
  name: voc
  root: data/voc
  num_classes: 21  # 20 + background

model:
  backbone: resnet50_fpn
  num_classes: 21

train:
  epochs: 12
  batch_size: 4
  num_workers: 4
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_step_size: 8
  lr_gamma: 0.1
  print_freq: 50
  amp: false

paths:
  output_dir: outputs/
  ckpt_dir: checkpoints/

mlflow:
  enable: false
  experiment: faster-rcnn-detection
  tracking_uri: file:./mlruns
