# default training/eval config
seed: 42
device: cuda

dataset:
  name: voc
  root: data/voc
  num_classes: 21  # 20 + background
  train_split: trainval
  val_split: val

model:
  backbone: resnet50_fpn
  pretrained: true
  num_classes: 21
  trainable_backbone_layers: 3

train:
  epochs: 12
  batch_size: 4
  num_workers: 4
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_step_size: 8
  lr_gamma: 0.1
  print_freq: 50
  amp: false

eval:
  iou_thresh: 0.5
  score_thresh: 0.05
  nms_thresh: 0.5
  max_detections: 100

augment:
  hflip: 0.5
  resize_min: 600
  resize_max: 1000
  brightness: 0.2
  contrast: 0.2

# anchors are mostly fine at torchvision defaults; expose for tuning
rpn:
  pre_nms_top_n_train: 2000
  pre_nms_top_n_test: 1000
  post_nms_top_n_train: 2000
  post_nms_top_n_test: 1000
  fg_iou_thresh: 0.7
  bg_iou_thresh: 0.3

paths:
  output_dir: outputs/
  ckpt_dir: checkpoints/

mlflow:
  enable: false
  experiment: faster-rcnn-detection
  tracking_uri: file:./mlruns
