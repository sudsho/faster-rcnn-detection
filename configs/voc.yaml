# Pascal VOC 2007
seed: 42
device: cuda

dataset:
  name: voc
  root: data/voc
  num_classes: 21
  classes:
    - aeroplane
    - bicycle
    - bird
    - boat
    - bottle
    - bus
    - car
    - cat
    - chair
    - cow
    - diningtable
    - dog
    - horse
    - motorbike
    - person
    - pottedplant
    - sheep
    - sofa
    - train
    - tvmonitor

model:
  backbone: resnet50_fpn
  num_classes: 21

train:
  epochs: 12
  batch_size: 4
  num_workers: 4
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_step_size: 8
  lr_gamma: 0.1
  print_freq: 50
  amp: false

paths:
  output_dir: outputs/voc
  ckpt_dir: checkpoints/voc

mlflow:
  enable: true
  experiment: faster-rcnn-voc
  tracking_uri: file:./mlruns
