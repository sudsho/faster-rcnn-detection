# Pascal VOC 2007 + 2012 trainval
seed: 42
device: cuda

dataset:
  name: voc
  root: data/voc
  num_classes: 21
  train_split: trainval
  val_split: val
  classes:
    - aeroplane
    - bicycle
    - bird
    - boat
    - bottle
    - bus
    - car
    - cat
    - chair
    - cow
    - diningtable
    - dog
    - horse
    - motorbike
    - person
    - pottedplant
    - sheep
    - sofa
    - train
    - tvmonitor

model:
  backbone: resnet50_fpn
  pretrained: true
  num_classes: 21
  trainable_backbone_layers: 3

train:
  epochs: 12
  batch_size: 4
  num_workers: 4
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  lr_step_size: 8
  lr_gamma: 0.1
  print_freq: 50
  amp: false
  warmup_iters: 1000
  warmup_factor: 0.001

eval:
  iou_thresh: 0.5
  score_thresh: 0.05
  nms_thresh: 0.5
  max_detections: 100

augment:
  hflip: 0.5
  resize_min: 600
  resize_max: 1000
  brightness: 0.2
  contrast: 0.2

paths:
  output_dir: outputs/voc
  ckpt_dir: checkpoints/voc

mlflow:
  enable: true
  experiment: faster-rcnn-voc
  tracking_uri: file:./mlruns
